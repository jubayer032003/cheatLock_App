name: CheatLock Validation

on:
  pull_request:
    branches:
      - main
      - staging
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

concurrency:
  group: cheatlock-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_NOTIFY_USER_LIST: ""
        with:
          args: detect --source . --redact --no-banner --verbose

  backend-validation:
    name: Backend Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: secret-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root test harness dependencies
        run: npm ci

      - name: Install active backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend test suite
        run: node --test tests/*.test.js

      - name: Validate backend JavaScript syntax
        shell: bash
        run: |
          find backend/src tests -name '*.js' -print0 | xargs -0 -n 1 node --check

  web-dashboard-build:
    name: Web Dashboard Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: secret-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: web-dashboard
        run: npm ci

      - name: Build production dashboard
        working-directory: web-dashboard
        run: npm run build

  desktop-validation:
    name: Desktop Frontend Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: secret-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Run typecheck
        working-directory: desktop
        run: npm run typecheck

      - name: Run desktop test suite
        working-directory: desktop
        run: npm test

      - name: Build desktop frontend
        working-directory: desktop
        run: npm run build

  android-build:
    name: Android Debug Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: secret-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain --stacktrace --no-daemon
