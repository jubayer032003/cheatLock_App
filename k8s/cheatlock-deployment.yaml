apiVersion: v1
kind: Namespace
metadata:
  name: cheatlock
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cheatlock-config
  namespace: cheatlock
data:
  PORT: "3000"
  NODE_ENV: "production"
  # Exact browser origins only. Do not use "*".
  ALLOWED_ORIGINS: "https://replace-with-dashboard-origin"
  CLIENT_ORIGIN: "https://replace-with-dashboard-origin"
---
apiVersion: v1
kind: Secret
metadata:
  name: cheatlock-secret
  namespace: cheatlock
type: Opaque
stringData:
  # Placeholder-only template. Replace via kubectl, External Secrets, or your secret manager.
  # Do not commit real values here.
  MONGODB_URI: "replace-with-mongodb-uri"
  JWT_SECRET: "replace-with-a-long-random-value"
  REDIS_URL: "replace-with-redis-url"
  S3_ENDPOINT: "replace-with-s3-endpoint"
  S3_BUCKET: "replace-with-s3-bucket"
  S3_ACCESS_KEY: "replace-with-s3-access-key"
  S3_SECRET_KEY: "replace-with-s3-secret-key"
  S3_REGION: "us-east-1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cheatlock-backend
  namespace: cheatlock
  labels:
    app: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: backend
        image: cheatlock/backend:replace-with-release-tag
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: cheatlock-config
        - secretRef:
            name: cheatlock-secret
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health/live
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend-srv
  namespace: cheatlock
spec:
  selector:
    app: backend
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cheatlock-dashboard
  namespace: cheatlock
  labels:
    app: dashboard
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: dashboard
        image: cheatlock/dashboard:replace-with-release-tag
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-srv
  namespace: cheatlock
spec:
  selector:
    app: dashboard
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: cheatlock
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cheatlock-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cheatlock-ingress
  namespace: cheatlock
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
  - host: proctor.cheatlock.org
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-srv
            port:
              number: 3000
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: backend-srv
            port:
              number: 3000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dashboard-srv
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-network-policy
  namespace: cheatlock
spec:
  podSelector:
    matchLabels:
      app: backend
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
  policyTypes:
  - Ingress
